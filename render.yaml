# Render 一键部署配置（免费版）
# 部署方式：在 Render 新建 "Blueprint" 并关联本仓库，自动读取此文件。
# 注意：免费版(free)不支持持久磁盘(disk)，故此处不含 disk 配置；
#       后台编辑的内容在重新部署后会重置。要持久化请升级 Starter 及以上，
#       并在 Render 控制台为该服务手动添加 Disk（挂载到 /data，配合 DATA_DIR=/data）。
services:
  - type: web
    name: software-intro-site
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: ADMIN_PASSWORD          # 务必设置，否则后台公网裸奔
        sync: false
