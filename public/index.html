<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>软件介绍</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="hero">
    <a class="admin-link" href="/admin">管理后台</a>
    <h1 id="siteTitle">软件介绍</h1>
    <p id="siteSubtitle"></p>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <label class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search" type="text" placeholder="搜索软件名称、功能、分类…" autocomplete="off" />
      </label>
      <select class="sort" id="sort">
        <option value="default">默认排序</option>
        <option value="update">最近更新</option>
        <option value="name">名称 A→Z</option>
        <option value="articles">文章数</option>
      </select>
    </div>
    <div class="result-count" id="count"></div>
  </div>

  <nav class="filters" id="filters"></nav>

  <main class="grid" id="grid"></main>

  <div class="empty" id="empty" style="display:none">没有匹配的软件，试试其他关键词或分类。</div>

  <footer class="site-foot" id="siteFooter"></footer>

  <!-- 详情弹窗 -->
  <div class="modal-mask" id="modal">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2 id="mTitle"></h2>
          <div class="modal-meta" id="mMeta"></div>
        </div>
        <button class="modal-close" id="mClose">×</button>
      </div>
      <div class="modal-body" id="mBody"></div>
      <div class="modal-foot" id="mFoot"></div>
    </div>
  </div>

  <div class="toast" id="toast">内容已更新</div>

  <script src="/js/app.js"></script>
</body>
</html>
